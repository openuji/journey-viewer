name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - app
          - cli
          - design-system
          - flow-layout
          - lint
          - ujg-jsonld
          - viewer
      version:
        description: Stable version already committed in the package manifest
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.package }}@${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_PACKAGE: ${{ inputs.package }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.9.0
          runtime: node@24
          cache: false
          install: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Test packed packages as an external consumer
        run: pnpm test:consumer
      - name: Publish selected package
        run: >-
          pnpm run release:publish --
          --package "$RELEASE_PACKAGE"
          --version "$RELEASE_VERSION"
